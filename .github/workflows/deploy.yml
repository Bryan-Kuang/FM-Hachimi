name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Never run two production deploys at once; queue the newer one instead of
# cancelling an in-flight SSH/compose deploy mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        env:
          # Pull the exact image CI built for this commit (not a moving :latest).
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          timeout: 30s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/bilibili-bot

            echo "[deploy] fetching origin/main..."
            timeout 120 git fetch --prune origin main

            echo "[deploy] fast-forward pulling..."
            timeout 60 git pull --ff-only origin main

            bash scripts/deploy/remote-deploy.sh

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Deploy Failed\",\"color\":15158332,\"description\":\"**Branch:** \`${{ github.event.workflow_run.head_branch }}\`\\n**Commit:** \`${{ github.event.workflow_run.head_sha }}\`\\n[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}]}"

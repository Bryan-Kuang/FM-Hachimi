name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          TEST_MODE: true
          NODE_ENV: test
          # Disable husky hooks in CI
          HUSKY: 0

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Backstop: if any step below hangs (stuck SSH, stuck git pull, stuck
    # docker build), GitHub kills the job at 20 min instead of the default 6h.
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # SSH-session-level timeouts. `timeout` is the TCP connect phase;
          # `command_timeout` bounds the whole remote script. Both guard
          # against the Oracle VPS silently dropping the connection mid-run.
          timeout: 30s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/bilibili-bot

            # `timeout` wraps each network-bound step so a stuck git or
            # docker build fails loudly in under N seconds instead of
            # keeping a CD worker wedged. Exit code 124 = timed out.
            echo "[deploy] fetching origin/main..."
            timeout 120 git fetch --prune origin main

            # --ff-only refuses to clobber unexpected local commits on the
            # VPS (e.g. someone hand-edited for a hotfix). Surfaces the
            # divergence as a visible failure rather than a silent merge.
            echo "[deploy] fast-forward pulling..."
            timeout 60 git pull --ff-only origin main

            # Ensure host-mounted directories exist before docker-compose
            # creates them — Docker auto-creates missing bind-mount sources as
            # root-owned directories which the node user inside the container
            # cannot write to.
            mkdir -p data logs

            echo "[deploy] rebuilding containers..."
            timeout 600 docker-compose up -d --build

            echo "[deploy] pruning unused images..."
            timeout 60 docker image prune -f

            # Health check: give the container up to 30 seconds to reach
            # running state. If it crashes on startup (bad config, missing
            # env var, etc.) we catch it here instead of silently failing.
            echo "[deploy] waiting for container to be healthy..."
            CONTAINER=$(docker-compose ps -q 2>/dev/null | head -1)
            if [ -n "$CONTAINER" ]; then
              for i in $(seq 1 6); do
                STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
                if [ "$STATUS" = "running" ]; then
                  echo "[deploy] container is running."
                  break
                fi
                if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                  echo "[deploy] container exited unexpectedly (status: $STATUS)."
                  docker-compose logs --tail=50
                  exit 1
                fi
                echo "[deploy] container status: $STATUS, waiting... ($i/6)"
                sleep 5
              done
            fi

            echo "[deploy] done."

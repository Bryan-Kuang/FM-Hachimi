name: Deploy Discord Commands

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target: guild is instant, global can take up to 1h, clear_guild removes guild-scoped duplicates'
        required: false
        default: 'global'
        type: choice
        options:
          - global
          - guild
          - clear_guild
      guild_id:
        description: 'Guild ID for guild / clear_guild. Leave empty to use the GUILD_ID secret.'
        required: false

jobs:
  deploy-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy slash commands to Discord
        run: node scripts/deploy-commands.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ (inputs.environment == 'guild' || inputs.environment == 'clear_guild') && (inputs.guild_id || secrets.GUILD_ID) || '' }}
          # The script only does a guild-scoped deploy/clear when this flag is set;
          # without it, `guild` silently fell through to a global deploy and
          # `clear_guild` threw on its own guard. Set it for both guild options.
          DEPLOY_LEGACY_GUILD_COMMANDS: ${{ (inputs.environment == 'guild' || inputs.environment == 'clear_guild') && 'true' || '' }}
          CLEAR_GUILD_COMMANDS: ${{ inputs.environment == 'clear_guild' && 'true' || '' }}

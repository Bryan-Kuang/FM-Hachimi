name: Deploy Discord Commands

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'global=stable cmds everywhere (~1h); test=stage:testing cmds to the test guild only (instant, no dups); guild=ALL cmds to one guild (instant, can duplicate global); clear_guild=remove guild-scoped cmds'
        required: false
        default: 'global'
        type: choice
        options:
          - global
          - test
          - guild
          - clear_guild
      guild_id:
        description: 'Guild ID for guild / clear_guild. Leave empty to use the GUILD_ID secret. (test uses TEST_GUILD_ID, ignores this.)'
        required: false

jobs:
  deploy-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy slash commands to Discord
        run: node scripts/deploy-commands.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ (inputs.environment == 'guild' || inputs.environment == 'clear_guild') && (inputs.guild_id || secrets.GUILD_ID) || '' }}
          # `test` deploys only stage:'testing' commands to TEST_GUILD_ID (clean,
          # no overlap with global -> no duplicates).
          DEPLOY_TEST_COMMANDS: ${{ inputs.environment == 'test' && 'true' || '' }}
          # The script only does a legacy guild-scoped deploy/clear when this flag
          # is set; without it, `guild` silently fell through to a global deploy and
          # `clear_guild` threw on its own guard. (Mutually exclusive with the test
          # flag, which createDeploymentPlan enforces.)
          DEPLOY_LEGACY_GUILD_COMMANDS: ${{ (inputs.environment == 'guild' || inputs.environment == 'clear_guild') && 'true' || '' }}
          CLEAR_GUILD_COMMANDS: ${{ inputs.environment == 'clear_guild' && 'true' || '' }}

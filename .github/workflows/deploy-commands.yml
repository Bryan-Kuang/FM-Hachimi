name: Deploy Discord Commands

# 触发方式：
# 1. 手动从 GitHub Actions 页面点 "Run workflow"
# 2. push 到 main 时，如果命令定义文件发生变化，自动触发
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target: guild=指定服务器(即时) global=全局(1h) clear_guild=清除指定服务器的Guild命令(修重复)'
        required: false
        default: 'global'
        type: choice
        options:
          - global
          - guild
          - clear_guild
      guild_id:
        description: 'guild / clear_guild 模式的服务器 ID（留空则用 GUILD_ID secret）'
        required: false

  push:
    branches: [main]
    paths:
      - 'src/bot/commands/**'
      - 'scripts/deploy-commands.js'

jobs:
  deploy-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy slash commands to Discord
        run: node scripts/deploy-commands.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          # guild / clear_guild → 优先用手动输入的 guild_id，否则用 secret
          # global / push 自动触发 → 传入 secret（作为自动去重的参考 guild，若存在则清除 guild-scoped 命令）
          GUILD_ID: ${{ (inputs.environment == 'guild' || inputs.environment == 'clear_guild') && (inputs.guild_id || secrets.GUILD_ID) || secrets.GUILD_ID || '' }}
          # clear_guild 模式：向 Discord 发送空命令列表来清除 guild-scoped 命令
          CLEAR_GUILD_COMMANDS: ${{ inputs.environment == 'clear_guild' && 'true' || '' }}

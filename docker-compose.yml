services:
  bilibili-bot:
    # Production pulls the prebuilt image from GHCR (IMAGE_TAG = commit SHA,
    # injected by the deploy workflow; defaults to latest). The build section
    # below is retained for local dev — `docker compose up --build` still builds
    # from the Dockerfile and tags it as this image.
    image: ghcr.io/bryan-kuang/fm-hachimi:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilibili-discord-bot
    restart: unless-stopped

    # Run as the host's bind-mount owner so writes to ./data, ./logs, and
    # cookies.txt don't EACCES. Default 1000:1000 matches stock Linux first
    # user (and the in-image `node` user). Oracle Cloud's Ubuntu image is
    # the exception — there `opc` is uid 1000 and `ubuntu` is uid 1001, so
    # set HOST_UID=1001 / HOST_GID=1001 in .env on those VPSes.
    #
    # Without this override the container ran as image-default `node`(1000)
    # while ./data was owned by host `ubuntu`(1001), and every
    # `/daily-hachimi setup` silently failed to persist the schedule
    # (EACCES on /app/data/daily_hachimi.json) — the cron never re-armed
    # after a container rebuild. (root cause of 2026-04-28 incident)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # Environment variables from .env file
    env_file:
      - .env

    # Docker is the blessed setup path, so the in-container health endpoint is
    # always enabled. The host binding below keeps metrics/health local to the VPS.
    environment:
      METRICS_ENABLED: "true"
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9090"
      # bgutil PO-token provider sidecar (service below). The yt-dlp plugin in
      # the bot image fetches GVS PO tokens from it — YouTube requires PO
      # tokens for a growing set of clients or stream URLs 403.
      YTDLP_POT_PROVIDER_URL: "http://pot-provider:4416"

    # Expose the in-container metrics server to the host's loopback only.
    # The metrics server must also be told to bind on all interfaces inside
    # the container (not 127.0.0.1), otherwise the port forward has no one
    # to connect to. Set METRICS_HOST=0.0.0.0 in .env.
    #
    # Security: binding to 127.0.0.1:9090 on the host means the port is only
    # reachable from inside the VPS (e.g. over SSH tunnel), never from the
    # public internet — /metrics and /healthz should not be exposed publicly.
    ports:
      - "127.0.0.1:9090:9090"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits (Oracle Cloud Free Tier friendly)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Health check.
    # Points at /readyz, not /healthz: /healthz is a static 200 that only proves
    # the process is alive, which is why Docker reported "healthy" throughout the
    # 2026-09-01 gateway outage while the bot answered nobody. /readyz follows
    # the actual gateway connection, so `docker ps` and any ops alerting on it
    # tell the truth. Recovery itself is the in-process watchdog's job
    # (src/bot/gateway_watchdog.ts) — an unhealthy container is not restarted by
    # the restart policy on its own.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Volumes for persistent data (logs), private cookie secrets, and daily schedule config.
    # data/ must be a host-mounted volume so daily_hachimi.json survives
    # container rebuilds — without this the cron schedule is lost on every deploy.
    # secrets/ is mounted as a directory so in-place cookie refreshes are visible
    # to the running container without the stale-inode behavior of single-file mounts.
    volumes:
      - ./logs:/app/logs
      - ./secrets:/app/secrets
      - ${YOUTUBE_COOKIE_PROFILE_HOST:-/home/ubuntu/.fm-hachimi-youtube/profile}:/app/youtube-browser-profile:ro
      - ./data:/app/data
      # Persistent downloaded-audio cache (replayed videos play from local files).
      - ./cache:/app/cache

    # Shared network with the pot-provider sidecar. Was `network_mode: bridge`
    # before 2026-07: that put the bot on the default bridge while the
    # provider sat on a compose network — unreachable, so yt-dlp silently ran
    # with "PO Token Providers: none" (part of the 2026-07-01 403 incident).
    networks:
      - botnet

  # bgutil PO-token provider — generates the "proof of origin" tokens YouTube
  # demands for stream URLs. The bot image carries the matching yt-dlp plugin
  # (bgutil-ytdlp-pot-provider) which calls this service on demand; keep the
  # image and the pip package on compatible versions (both track latest).
  # No host ports: only reachable from the bot over the compose network.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: fm-hachimi-pot-provider
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - botnet

networks:
  botnet:

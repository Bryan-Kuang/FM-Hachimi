services:
  bilibili-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilibili-discord-bot
    restart: unless-stopped

    # Run as the host's bind-mount owner so writes to ./data, ./logs, and
    # cookies.txt don't EACCES. Default 1000:1000 matches stock Linux first
    # user (and the in-image `node` user). Oracle Cloud's Ubuntu image is
    # the exception — there `opc` is uid 1000 and `ubuntu` is uid 1001, so
    # set HOST_UID=1001 / HOST_GID=1001 in .env on those VPSes.
    #
    # Without this override the container ran as image-default `node`(1000)
    # while ./data was owned by host `ubuntu`(1001), and every
    # `/daily-hachimi setup` silently failed to persist the schedule
    # (EACCES on /app/data/daily_hachimi.json) — the cron never re-armed
    # after a container rebuild. (root cause of 2026-04-28 incident)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # Environment variables from .env file
    env_file:
      - .env

    # Expose the in-container metrics server to the host's loopback only.
    # The metrics server must also be told to bind on all interfaces inside
    # the container (not 127.0.0.1), otherwise the port forward has no one
    # to connect to. Set METRICS_HOST=0.0.0.0 in .env.
    #
    # Security: binding to 127.0.0.1:9090 on the host means the port is only
    # reachable from inside the VPS (e.g. over SSH tunnel), never from the
    # public internet — /metrics and /healthz should not be exposed publicly.
    ports:
      - "127.0.0.1:9090:9090"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits (Oracle Cloud Free Tier friendly)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('./dist/index.js')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Volumes for persistent data (logs), cookies, and daily schedule config.
    # data/ must be a host-mounted volume so daily_hachimi.json survives
    # container rebuilds — without this the cron schedule is lost on every deploy.
    volumes:
      - ./logs:/app/logs
      - ./cookies.txt:/app/cookies.txt
      - ./data:/app/data

    # Network mode
    network_mode: bridge

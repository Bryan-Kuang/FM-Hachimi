services:
  bilibili-bot:
    # Production pulls the prebuilt image from GHCR (IMAGE_TAG = commit SHA,
    # injected by the deploy workflow; defaults to latest). The build section
    # below is retained for local dev — `docker compose up --build` still builds
    # from the Dockerfile and tags it as this image.
    image: ghcr.io/bryan-kuang/fm-hachimi:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilibili-discord-bot
    restart: unless-stopped

    # Run as the host's bind-mount owner so writes to ./data, ./logs, and
    # cookies.txt don't EACCES. Default 1000:1000 matches stock Linux first
    # user (and the in-image `node` user). Oracle Cloud's Ubuntu image is
    # the exception — there `opc` is uid 1000 and `ubuntu` is uid 1001, so
    # set HOST_UID=1001 / HOST_GID=1001 in .env on those VPSes.
    #
    # Without this override the container ran as image-default `node`(1000)
    # while ./data was owned by host `ubuntu`(1001), and every
    # `/daily-hachimi setup` silently failed to persist the schedule
    # (EACCES on /app/data/daily_hachimi.json) — the cron never re-armed
    # after a container rebuild. (root cause of 2026-04-28 incident)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # Environment variables from .env file
    env_file:
      - .env

    # Docker is the blessed setup path, so the in-container health endpoint is
    # always enabled. The host binding below keeps metrics/health local to the VPS.
    environment:
      METRICS_ENABLED: "true"
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9090"

    # Expose the in-container metrics server to the host's loopback only.
    # The metrics server must also be told to bind on all interfaces inside
    # the container (not 127.0.0.1), otherwise the port forward has no one
    # to connect to. Set METRICS_HOST=0.0.0.0 in .env.
    #
    # Security: binding to 127.0.0.1:9090 on the host means the port is only
    # reachable from inside the VPS (e.g. over SSH tunnel), never from the
    # public internet — /metrics and /healthz should not be exposed publicly.
    ports:
      - "127.0.0.1:9090:9090"

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits (Oracle Cloud Free Tier friendly)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Volumes for persistent data (logs), private cookie secrets, and daily schedule config.
    # data/ must be a host-mounted volume so daily_hachimi.json survives
    # container rebuilds — without this the cron schedule is lost on every deploy.
    # secrets/ is mounted as a directory so in-place cookie refreshes are visible
    # to the running container without the stale-inode behavior of single-file mounts.
    volumes:
      - ./logs:/app/logs
      - ./secrets:/app/secrets
      - ${YOUTUBE_COOKIE_PROFILE_HOST:-/home/ubuntu/.fm-hachimi-youtube/profile}:/app/youtube-browser-profile:ro
      - ./data:/app/data

    # On a user-defined network so the bot can resolve the PO-token provider by
    # service name. Outbound internet + the loopback metrics port both still work.
    networks:
      - botnet
    depends_on:
      - pot-provider

  # PO Token (Proof-of-Origin) provider. yt-dlp uses it to pass YouTube's
  # "Sign in to confirm you're not a bot" check on the data-center IP without
  # cookies — which is what makes the cookie-less fast clients usable. Internal
  # only; the bot reaches it at http://pot-provider:4416 (see YOUTUBE_POT_PROVIDER_URL).
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: fm-hachimi-pot-provider
    restart: unless-stopped
    networks:
      - botnet
    # Lightweight, but cap it to stay friendly on the Oracle free tier.
    deploy:
      resources:
        limits:
          memory: 320M

networks:
  botnet:
    driver: bridge
